<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Copytrader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2322c55e'/><path d='M7 21l6-6 4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="card login-card">
      <h1>Copytrader</h1>
      <p class="muted">Enter your password</p>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button class="btn primary" type="submit">Log in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="top">
      <span class="brand">Copytrader</span>
      <span id="status" class="pill"></span>
    </header>

    <main>
      <section id="tab-home" class="tab"></section>
      <section id="tab-wallets" class="tab" hidden></section>
      <section id="tab-activity" class="tab" hidden></section>
      <section id="tab-settings" class="tab" hidden></section>
    </main>

    <nav class="tabs">
      <button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/></svg>Home</button>
      <button data-tab="wallets"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Wallets</button>
      <button data-tab="activity"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Activity</button>
      <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Settings</button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
